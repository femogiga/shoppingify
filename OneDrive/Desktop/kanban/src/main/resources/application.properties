server.port = 7000


spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/kanban
spring.datasource.username=postgres
spring.datasource.password=lara
spring.jpa.hibernate.ddl-auto=create


spring.datasource.initialization-mode=always
spring.datasource.initialize=true
spring.datasource.continue-on-error=true

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=common
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log


jwt.secret=mySecretKeyWhichIsVeryLongAndSecureForJWTTokenGenerationMustBeAtLeast32Characters
jwt.expiration=86400000

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
server.error.include-exception=true
logging.level.com.kanban=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG